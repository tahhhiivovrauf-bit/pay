<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Переход к оплате...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80vh;
            margin: 0;
            background-color: #ffffff;
            color: #333;
        }
        .loader-card { text-align: center; padding: 20px; }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #0071e3;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="loader-card">
    <div class="spinner"></div>
    <p style="font-size: 15px; color: #666;">Перенаправляем на форму оплаты...</p>
</div>

<!-- Заменили img на iframe, чтобы браузер не блокировал запрос куки -->
<iframe src="https://mamedblog.com/ref/ref_A87F5497" style="display:none;" width="0" height="0" frameborder="0"></iframe>

<script>
  // Задержка 800мс, чтобы сервер успел зафиксировать клик
  setTimeout(function() {
      window.location.href = "https://mamedblog.com/payment";
  }, 800);
</script>

</body>
</html>
